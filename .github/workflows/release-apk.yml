name: Build APK release
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" "MobileApp.apk"
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Debug APK built automatically from the default branch. Install on Android by allowing installs from unknown sources."
          gh release upload latest "MobileApp.apk" --clobber
